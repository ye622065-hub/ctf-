services:
  web:
    build: .
    image: ctf-user-mgr-py
    container_name: ctf-user-mgr-web
    ports:
      # 题目访问入口：宿主机高端口 33070 -> 容器内 Flask 5000
      - "33070:5000"
    depends_on:
      - db
    environment:
      # 容器之间固定走服务名 db + 容器端口 3306
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ctf
      DB_PASS: ctf123456
      DB_NAME: user_system
      SECRET_KEY: change-this-secret-key
      TZ: Asia/Shanghai
      # 动态 flag：平台启动容器时会覆盖此环境变量，题目启动时自动写入数据库
      # 本地测试可保留此值，正式部署由平台注入
      FLAG: flag{Cl1ent_S1de_Pr1ce_Tamp3r1ng!}
    volumes:
      - ./app:/app
    restart: unless-stopped

  db:
    image: mysql:5.7
    container_name: ctf-user-mgr-db
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: user_system
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      # 首次启动自动执行，建库建表并投放账号/订单/flag
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      # 宿主机高端口 33060 -> 容器 3306，用 Navicat / DataGrip 远程连接投放数据
      - "33060:3306"
    restart: unless-stopped
