<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户订单管理系统 - 首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; }
        .topbar {
            background: #fff; padding: 0 32px; height: 60px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        .topbar .title { font-size: 18px; font-weight: bold; color: #333; }
        .topbar .info { font-size: 14px; color: #666; }
        .topbar a { color: #667eea; text-decoration: none; margin-left: 16px; }
        .container { max-width: 960px; margin: 32px auto; padding: 0 16px; }
        .container h2 { font-size: 18px; color: #333; margin-bottom: 20px; }
        .cards { display: flex; gap: 24px; flex-wrap: wrap; }
        .card {
            background: #fff; border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
            padding: 28px; width: 420px; flex-shrink: 0;
        }
        .card h3 { font-size: 19px; color: #333; margin-bottom: 16px; }
        .card .row {
            display: flex; justify-content: space-between;
            font-size: 14px; color: #666; padding: 7px 0;
            border-bottom: 1px dashed #eee;
        }
        .card .row:last-of-type { border-bottom: none; }
        .card .row .v { color: #333; }
        .price { color: #f5222d !important; font-weight: bold; }
        .tag {
            display: inline-block; padding: 2px 10px; border-radius: 10px;
            font-size: 12px; background: #fff7e6; color: #fa8c16;
        }
        .tag.paid { background: #f6ffed; color: #52c41a; }
        .card .btn {
            display: block; text-align: center; margin-top: 20px; padding: 10px;
            background: #667eea; color: #fff; border-radius: 6px;
            text-decoration: none; font-size: 15px;
        }
        .card .btn:hover { background: #556cd6; }
    </style>
</head>
<body>
    <div class="topbar">
        <span class="title">用户订单管理系统</span>
        <span class="info">
            管理员：{{ session.get('login_user', 'admin') }}
            <a href="{{ url_for('logout') }}">退出登录</a>
        </span>
    </div>
    <div class="container">
        <h2>用户订单列表</h2>
        <div class="cards">
            {% for u in users %}
            <div class="card">
                <h3>{{ u.name }}</h3>
                <div class="row"><span>订单编号</span><span class="v">{{ u.order_no or '-' }}</span></div>
                <div class="row"><span>商品名称</span><span class="v">{{ u['product'] or '-' }}</span></div>
                <div class="row">
                    <span>未付款金额</span>
                    <span class="v price">&yen; {{ '%.2f'|format(u.amount or 0) }}</span>
                </div>
                <div class="row">
                    <span>订单状态</span>
                    <span class="v">
                        <span class="tag {{ 'paid' if u.status == '已付款' else '' }}">{{ u.status or '-' }}</span>
                    </span>
                </div>
                <a class="btn" href="{{ url_for('order_detail', cid=u.id) }}">查看订单详情</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
