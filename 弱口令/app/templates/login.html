<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户订单管理系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #fff;
            padding: 40px 36px;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,.25);
            width: 360px;
        }
        .login-box h1 { text-align: center; font-size: 22px; color: #333; margin-bottom: 6px; }
        .login-box .sub { text-align: center; color: #999; font-size: 13px; margin-bottom: 28px; }
        .form-item { margin-bottom: 18px; }
        .form-item label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; }
        .form-item input {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 15px; outline: none;
        }
        .form-item input:focus { border-color: #667eea; }
        .btn {
            width: 100%; padding: 11px; background: #667eea; color: #fff;
            border: none; border-radius: 6px; font-size: 16px; cursor: pointer;
        }
        .btn:hover { background: #556cd6; }
        .error {
            background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e;
            padding: 9px 12px; border-radius: 6px; font-size: 13px;
            margin-bottom: 18px; text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>用户订单管理系统</h1>
        <p class="sub">User Order Management</p>
        {% if err %}
        <div class="error">登录失败，用户名或密码错误</div>
        {% endif %}
        <form action="{{ url_for('login') }}" method="post">
            <div class="form-item">
                <label>用户名</label>
                <input type="text" name="username" required autofocus placeholder="请输入用户名">
            </div>
            <div class="form-item">
                <label>密码</label>
                <input type="password" name="password" required placeholder="请输入密码">
            </div>
            <button type="submit" class="btn">登 录</button>
        </form>
    </div>
</body>
</html>
