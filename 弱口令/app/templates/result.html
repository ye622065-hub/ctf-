<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>付款结果</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        .box {
            background: #fff; border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
            padding: 40px; width: 480px; text-align: center;
        }
        .ico { font-size: 44px; color: #52c41a; }
        h2 { font-size: 20px; color: #333; margin: 14px 0 8px; }
        p { color: #666; font-size: 14px; line-height: 1.7; }
        .flag {
            margin-top: 18px; padding: 14px; background: #f6ffed;
            border: 1px dashed #52c41a; border-radius: 6px;
            font-size: 15px; color: #333; word-break: break-all;
        }
        a {
            display: inline-block; margin-top: 22px; padding: 9px 28px;
            background: #667eea; color: #fff; text-decoration: none; border-radius: 6px;
        }
    </style>
    <!-- 改包金额 < 10 付款成功：弹窗显示第一段 flag（Base64 编码，需自行解码） -->
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            alert({{ ('付款成功！第一段 flag（Base64 编码，请自行解码）：' + flag)|tojson }});
        });
    </script>
</head>
<body>
    <div class="box">
        <div class="ico">&#10003;</div>
        <h2>付款成功</h2>
        <p>实付金额 &yen; {{ '%.2f'|format(amount) }}，支付成功！</p>
        <div class="flag">第一段 flag（Base64 编码）：{{ flag }}</div>
        <br>
        <a href="{{ url_for('order_detail', cid=1) }}">返回订单</a>
    </div>
</body>
</html>
